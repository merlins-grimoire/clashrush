[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-rush-rebuild"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clash-rush-rebuild = "clash_rush_rebuild.control_plane_cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
